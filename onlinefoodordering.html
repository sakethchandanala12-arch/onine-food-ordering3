
<!DOCTYPE html>
<html>
<head>
    <title>Online Food Ordering</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #fff3e0;
        }
        h1 {
            color: darkred;
        }
        .food {
            display: inline-block;
            background: white;
            padding: 15px;
            margin: 15px;
            border-radius: 10px;
        }
        img {
            width: 200px;
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1>Foodie's Restaurant</h1>
    <h2>Online Food Ordering System</h2>

    <div class="food">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400">
        <h3>Burger</h3>
        <p>Price: ₹120</p>
    </div>

    <div class="food">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400">
        <h3>Pizza</h3>
        <p>Price: ₹250</p>
    </div>

    <div class="food">
        <img src="https://images.unsplash.com/photo-1563379091339-03246963d96c?w=400">
        <h3>Biryani</h3>
        <p>Price: ₹180</p>
    </div>

</body>
</html>
