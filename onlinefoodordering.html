
<!DOCTYPE html>
<html>
<head>
    <title>Online Food Ordering</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #fff3e0;
        }

        h1 {
            color: darkred;
        }

        .food {
            display: inline-block;
            background: white;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            width: 180px;
        }

        button {
            background-color: darkred;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Foodie's Restaurant</h1>
    <h2>Online Food Ordering System</h2>

    <div class="food">
        <h3>Burger</h3>
        <p>Price: ₹120</p>
        <button>Order Now</button>
    </div>

    <div class="food">
        <h3>Pizza</h3>
        <p>Price: ₹250</p>
        <button>Order Now</button>
    </div>

    <div class="food">
        <h3>Biryani</h3>
        <p>Price: ₹180</p>
        <button>Order Now</button>
    </div>

</body>
</html>
